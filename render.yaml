services:
  - type: web
    name: seeds-palestine-schools-backend
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    rootDir: backend
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "true"
      - key: MONGODB_URI
        value: mongodb+srv://wildacademy4_db_user:wild2345@cluster0.nnip6sq.mongodb.net/?appName=Cluster0
      - key: FORCE_FILE_STORAGE
        value: "false"
      - key: SERVE_STATIC
        value: "false"
      - key: FRONTEND_URL
        value: "https://your-vercel-app.vercel.app"
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPER_ADMIN_USERNAME
        value: superadmin
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true
      - key: BRANCH_ADMIN_USERNAME
        value: branchadmin
      - key: BRANCH_ADMIN_PASSWORD
        generateValue: true
      - key: LOGIN_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "15"
      - key: API_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: API_RATE_LIMIT_MAX
        value: "500"

databases: []
